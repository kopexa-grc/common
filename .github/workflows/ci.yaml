name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code:
    name: Code Verification
    uses: ./.github/workflows/_verify-code.yaml
    # The called workflow cannot get more than the caller grants, and the
    # default token is read-only: grant what its jobs ask for.
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json